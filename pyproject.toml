[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-pose-estimation"
version = "0.1.0"
description = "Real-time driver body pose estimation from a local webcam using Ultralytics YOLO."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }

authors = [
    { name = "Elena Lopez Tomas" }
]

dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.9",
    "ultralytics>=8.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6"
]

[project.scripts]
driver-pose = "driver_pose_estimation.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"