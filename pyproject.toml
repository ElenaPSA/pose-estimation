[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-pose-estimation"
version = "0.2.0"
description = "Driver pose estimation and simulated seat comfort agent."
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }

authors = [
    { name = "Elena Lopez Tomas" }
]

dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.9",
    "ultralytics>=8.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6"
]

[project.scripts]
driver-pose = "driver_pose_estimation.main:run"
driver-pose-capture = "driver_pose_estimation.morphology_capture:run"
driver-seat-hmi = "driver_pose_estimation.seat_hmi:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
driver_pose_estimation = ["assets/*.png", "assets/*.svg", "assets/*.js", "assets/*.onnx", "assets/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"